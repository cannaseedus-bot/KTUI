# Plans: linear compositions of registered functions (see functions.py for the contracts).
#
# A plan is data. AIML/SRAI may propose one by name, but `planner.resolve` admits it only if every
# step is registered, implemented, and type-chained; `planner.run` then requires authority =
# "execute". `{term}` is replaced by whatever followed the intent ("find aiml categories <term>").
#
# Two plans on purpose: one that genuinely runs end to end, and one that the registry refuses.

[plan.search_aiml_categories]
title = "Find the AIML categories that mention something"
authority = "execute"
steps = [
  { function = "search", args = { pattern = "{term}", path = ".", glob = "*.aiml" } },
  { function = "parse_aiml" },
  { function = "filter_categories", args = { needle = "{term}" } },
  { function = "rank_by_context", args = { context = "{term}" } },
  { function = "fold_lines", args = { title = "AIML categories matching {term}" } },
]

[plan.search_aiml_chain]
title = "Show the AIML categories behind a git command"
authority = "execute"
steps = [
  { function = "search", args = { pattern = "GIT", path = ".", glob = "*.aiml" } },
  { function = "parse_aiml" },
  { function = "rank_by_context", args = { context = "git status diff log" } },
  { function = "fold_lines", args = { title = "AIML categories that answer git questions" } },
]

# fetch_weather is registered as proposal_only with no handler, so admission stops at step 1: the
# composition is *proposed* and refused rather than half-run. This is the boundary the whole module
# exists to draw - a name in a template cannot become a capability the host does not have.
[plan.weather_report]
title = "Fetch the weather and summarise it"
authority = "proposal_only"
steps = [
  { function = "fetch_weather", args = { city = "{term}" } },
  { function = "fold_lines", args = { title = "Weather for {term}" } },
]
